# Configuração do Alembic. A URL do banco NÃO fica aqui: o env.py a monta a partir das mesmas
# variáveis de ambiente (app/config.py) que a aplicação usa, então há uma única fonte de verdade
# e nenhuma senha escrita em arquivo versionado.

[alembic]
script_location = %(here)s/db/migrations
prepend_sys_path = .
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
