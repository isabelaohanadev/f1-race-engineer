name: f1-race-engineer

# Credenciais compartilhadas entre db e app, definidas uma única vez (âncora YAML).
# O Compose lê o .env da raiz automaticamente para resolver ${VAR}; o ":-" dá um default
# de dev, então `docker compose up --build` funciona mesmo sem criar o .env.
x-postgres-env: &postgres-env
  POSTGRES_USER: ${POSTGRES_USER:-f1}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-f1_dev_password}
  POSTGRES_DB: ${POSTGRES_DB:-f1_race_engineer}

# Base comum de tudo que roda o código do projeto (app agora; migrate e, na Fase 2, workers).
# A mesma `image:` nos dois serviços faz ambos usarem a MESMA imagem; o segundo build é só
# cache hit. Banco e Redis são alcançados pelo nome do serviço (db, redis) e pela porta interna.
x-app-base: &app-base
  build: .
  image: f1-race-engineer:local
  environment:
    <<: *postgres-env
    POSTGRES_HOST: db
    POSTGRES_PORT: "5432"
    REDIS_HOST: redis
    REDIS_PORT: "6379"
    FASTF1_CACHE_DIR: /cache/fastf1

services:
  db:
    # Imagem oficial do Postgres 16 com a extensão TimescaleDB já instalada. Usamos Timescale
    # porque a telemetria de posição é uma série temporal enorme (milhões de linhas por
    # corrida): hypertables particionam por tempo e dão compressão e consultas por janela rápidas.
    # Versão FIXADA (não `latest`): a extensão vive dentro do volume de dados, e trocar a versão
    # do binário por baixo de um volume existente exige `ALTER EXTENSION ... UPDATE`. Fixar evita
    # que um `docker compose pull` mude o comportamento das migrations sem ninguém perceber.
    image: timescale/timescaledb:2.30.2-pg16
    restart: unless-stopped
    environment: *postgres-env
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # Volume nomeado: os dados sobrevivem a `docker compose down` (só `down -v` apaga).
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      # "$$" evita que o Compose interpole; quem expande a variável é o shell do container.
      # `-h 127.0.0.1` força TCP de propósito: no primeiro boot a imagem roda um servidor
      # TEMPORÁRIO (só socket Unix) para os scripts de init. Sem -h, o pg_isready acharia que o
      # banco está pronto cedo demais e o `migrate` (que conecta por TCP) falharia na 1ª subida.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Redis é o "barramento" da Fase 2: o motor de replay publica eventos num Stream, os workers
  # consomem por consumer group e a API entrega por WebSocket. Os dados de verdade continuam no
  # Postgres: o que está aqui é derivado e pode ser regenerado reiniciando o replay.
  redis:
    # Versão FIXADA (não `latest`), mesma lógica do Timescale. Alpine: imagem pequena. Mantenha em
    # sincronia com o service container do .github/workflows/ci.yml.
    image: redis:8.6.7-alpine
    restart: unless-stopped
    # Flags (o ENTRYPOINT da imagem passa o comando ao redis-server):
    #  --appendonly yes: grava cada escrita num log (AOF, fsync a cada 1 s). Se o Redis reiniciar no
    #    meio da corrida, o stream e os consumer groups voltam como estavam: os workers só
    #    reconectam. Sem isso, um restart apagaria tudo e o replay teria de recomeçar.
    #  --maxmemory 256mb + noeviction: com a política padrão de despejo (allkeys-lru, em vários
    #    ambientes) o Redis poderia APAGAR O STREAM em silêncio quando a memória enche. Com
    #    `noeviction` ele recusa novas escritas (erro OOM), que o publisher vê e trata. A memória
    #    fica limitada de verdade porque o stream também é aparado (MAXLEN) ao publicar.
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - noeviction
    ports:
      # Só em 127.0.0.1: este Redis não tem senha, então NÃO pode ficar exposto à rede (o padrão do
      # Docker seria 0.0.0.0, o clássico Redis aberto na internet). Dentro da rede do compose os
      # outros serviços o acessam por redis:6379 sem depender desta publicação.
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      # `| grep -q PONG`: só um PONG de verdade significa "pronto para receber comandos". Enquanto
      # carrega o AOF no boot o Redis responde ao PING com um erro (LOADING), e o grep não depende
      # de como o redis-cli traduz uma resposta de erro em código de saída.
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Job one-shot: aplica as migrations e termina. Fica separado do app de propósito: se o app
  # rodasse `alembic upgrade` ao subir, várias réplicas (ou, na Fase 2, vários workers na mesma
  # imagem) disputariam a migration ao mesmo tempo. Aqui ela roda exatamente uma vez por `up`,
  # e quem depende do schema espera por `service_completed_successfully`.
  migrate:
    <<: *app-base
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    depends_on:
      db:
        condition: service_healthy

  app:
    <<: *app-base
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:8000"
    volumes:
      # Cache do FastF1 persistente: reingerir uma corrida não baixa tudo de novo da API.
      - fastf1_cache:/cache/fastf1
    depends_on:
      db:
        # Só sobe o app quando o Postgres está aceitando conexões (não apenas "container iniciado").
        condition: service_healthy
      migrate:
        # ...e depois que o schema foi criado/atualizado com sucesso.
        condition: service_completed_successfully
      redis:
        # O WebSocket e os endpoints de replay (próximas etapas) precisam do Redis. O depends_on só
        # ordena a SUBIDA: se o Redis cair depois, o app continua de pé (as rotas REST seguem
        # funcionando) e o código reconecta sozinho.
        condition: service_healthy
    healthcheck:
      # A imagem slim não tem curl; usamos o próprio Python. O /health devolve 503 quando o banco
      # cai, e o urlopen levanta exceção em 4xx/5xx: o container fica "unhealthy" no
      # `docker compose ps` (sem ser reiniciado: o restart policy não olha para o healthcheck).
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  pgdata:
  redisdata:
  fastf1_cache:
